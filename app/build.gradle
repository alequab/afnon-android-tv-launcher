plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.afnon.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.afnon.home'
        minSdk 26
        targetSdk 34
        // This fork's own releases: egyjs's version with a fourth part (0.9.0.1, 0.9.0.2…), so Updates sees each
        // as newer than the release it is built on; the code leaves room for 99 of ours per egyjs release.
        versionCode 1501
        versionName '0.9.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Spoken lines recorded as .wav (assets/announce) are opened with openFd, which needs them stored, not deflated.
    androidResources {
        noCompress 'wav'
    }
}

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
