plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.afnon.home'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.afnon.home'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Spoken lines recorded as .wav (assets/announce) are opened with openFd, which needs them stored, not deflated.
    androidResources {
        noCompress 'wav'
    }
}

dependencies {
    // Offline prayer-time calculation (no network, no transitive dependencies).
    implementation 'com.batoulapps.adhan:adhan:1.2.1'
}
