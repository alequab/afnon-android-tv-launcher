# Builds the TV app (app/) so changes to it are compiled on every push; releases are still built by hand (gh.md).
name: App

on:
  push:
    branches: [main]
    paths: ['app/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
