# Builds the phone installer (installer/) and keeps the APK as a workflow artifact.
name: Installer

on:
  push:
    branches: [main]
    paths: ['installer/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['installer/**', 'settings.gradle', 'build.gradle', 'gradle/**', '.github/workflows/installer.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :installer:assembleDebug --no-daemon --stacktrace
          cp installer/build/outputs/apk/debug/installer-debug.apk afnon-installer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: afnon-installer
          path: afnon-installer.apk
      # A pull request from this repo (or a run by hand): a pre-release with its APK, so it can be tried on a phone
      # before merging. Never "latest", so the README's releases/latest links are untouched.
      - name: Publish preview
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=installer-preview
          gh release view $tag >/dev/null 2>&1 || gh release create $tag --prerelease --target "$HEAD_SHA" \
            --title "Afnon Installer preview" --notes "Preview from the Installer workflow; not a release."
          gh release upload $tag afnon-installer.apk --clobber
          gh release edit $tag --prerelease --notes "Built from ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} @ ${HEAD_SHA::7} by the Installer workflow; not a release."

  # Every screen in Arabic and English on an emulator, pushed to the installer-screenshots branch (not main).
  screenshots:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: afnon-installer
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash installer/tools/shots.sh afnon-installer.apk shots
      - name: Push to installer-screenshots
        run: |
          cd shots
          git init -q -b installer-screenshots
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add *.png
          git commit -q -m "Installer screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" installer-screenshots
